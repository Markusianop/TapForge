AutoName: TapForge
Summary: Open-source NFC toolkit for NDEF, HCE, tags and ISO-DEP
Description: |-
  TapForge is a local-first NFC toolkit for Android.

  It supports phone-side NDEF Type 4 HCE, NFC receive mode, physical NDEF
  tag reading/writing, NDEF Studio, reusable profiles, batch writing with
  read-back verification, tag comparison, compatibility checks, APDU Lab,
  local history and rollback of the latest readable NDEF overwrite.

  TapForge has no Internet permission, ads, analytics or account requirement.

