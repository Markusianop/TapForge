AutoName: TapForge
Summary: Open-source NFC toolkit for NDEF, HCE, tags and ISO-DEP
Description: |-
  TapForge is a local-first NFC toolkit for Android. It supports phone-side
  NDEF Type 4 HCE, direct receive mode, physical NDEF tag reading/writing,
  NDEF Studio, reusable profiles, batch writing with read-back verification,
  comparison, compatibility checks, ISO-DEP APDU inspection, rollback and
  local history.

  It has no Internet permission, analytics, ads, account or cloud backend.

