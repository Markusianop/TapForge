name: Publish source tree

on:
  push:
    branches: [ main ]
    paths:
      - '.tapforge-bootstrap/**'
      - '.github/workflows/bootstrap-source.yml'

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand TapForge source
        shell: bash
        run: |
          set -euo pipefail
          cat .tapforge-bootstrap/chunk-* > /tmp/tapforge-source.b64
          base64 -d /tmp/tapforge-source.b64 > /tmp/tapforge-source.tar.xz
          mkdir -p /tmp/tapforge-source
          tar -xJf /tmp/tapforge-source.tar.xz -C /tmp/tapforge-source

          cp .github/workflows/android.yml /tmp/android.yml
          cp .github/workflows/bootstrap-source.yml /tmp/bootstrap-source.yml

          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a /tmp/tapforge-source/. .

          mkdir -p .github/workflows
          cp /tmp/android.yml .github/workflows/android.yml
          cp /tmp/bootstrap-source.yml .github/workflows/bootstrap-source.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish TapForge 1.0 source"
          git push origin HEAD:main
