name: Build TapForge 3.2.1 Whisper Hotfix

on:
  push:
    branches:
      - whisper-keystore-3.2.1-build

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore TapForge 3.1 base
        run: |
          mkdir -p /tmp/tapforge-3.2.1
          base64 -d .tapforge-build/glow-3.1.b64 > /tmp/tapforge-3.1.tar.xz
          tar -xJf /tmp/tapforge-3.1.tar.xz -C /tmp/tapforge-3.2.1

      - name: Apply Switchboard 3.2 patch
        working-directory: /tmp/tapforge-3.2.1
        run: |
          base64 -d "$GITHUB_WORKSPACE/.tapforge-build/switchboard-3.2.patch.xz.b64" | xz -d > /tmp/switchboard-3.2.patch
          patch -p1 --batch < /tmp/switchboard-3.2.patch

      - name: Apply Whisper 3.2.1 hotfix
        working-directory: /tmp/tapforge-3.2.1
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/com/tapforge/PocketKeyring.java")
          s = p.read_text()
          old = '''    public static byte[] seal(Context context, byte[] plain) throws Exception {
              byte[] iv = WhisperWire.random(12);
              Cipher c = Cipher.getInstance("AES/GCM/NoPadding");
              c.init(Cipher.ENCRYPT_MODE, vaultKey(context), new GCMParameterSpec(128, iv));
              byte[] encrypted = c.doFinal(plain);
              return WhisperWire.concat(iv, encrypted);
          }
          '''
          new = '''    public static byte[] seal(Context context, byte[] plain) throws Exception {
              Cipher c = Cipher.getInstance("AES/GCM/NoPadding");
              // Android Keystore requires the provider to generate the IV for keys
              // created with randomized encryption (the secure default).
              c.init(Cipher.ENCRYPT_MODE, vaultKey(context));
              byte[] iv = c.getIV();
              if (iv == null || iv.length != 12) throw new IllegalStateException("invalid keystore IV");
              byte[] encrypted = c.doFinal(plain);
              return WhisperWire.concat(iv, encrypted);
          }
          '''
          if old not in s:
              raise SystemExit("PocketKeyring hotfix target not found")
          p.write_text(s.replace(old, new))

          g = Path("app/build.gradle")
          t = g.read_text()
          t = t.replace("versionCode 22", "versionCode 23")
          t = t.replace("versionName '3.2'", "versionName '3.2.1'")
          g.write_text(t)

          ch = Path("CHANGELOG.md")
          if ch.exists():
              text = ch.read_text()
              entry = """## 3.2.1 — Whisper Keystore hotfix

          - Fixes Whisper preparation failing with `Caller-provided IV not permitted` on Android Keystore.
          - AES-GCM now uses the Keystore provider-generated IV while preserving the existing Letterbox format.

          """
              if "## 3.2.1" not in text:
                  ch.write_text(entry + text)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0" "platform-tools"

      - name: Install Gradle 8.9
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Build TapForge 3.2.1
        working-directory: /tmp/tapforge-3.2.1
        run: /tmp/gradle-8.9/bin/gradle --no-daemon clean assembleDebug assembleRelease

      - name: Collect APKs
        run: |
          cp /tmp/tapforge-3.2.1/app/build/outputs/apk/debug/app-debug.apk /tmp/TapForge-3.2.1-WhisperFix-test.apk
          cp /tmp/tapforge-3.2.1/app/build/outputs/apk/release/app-release-unsigned.apk /tmp/TapForge-3.2.1-WhisperFix-release-unsigned.apk
          sha256sum /tmp/TapForge-3.2.1-WhisperFix-test.apk /tmp/TapForge-3.2.1-WhisperFix-release-unsigned.apk > /tmp/SHA256SUMS.txt

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: TapForge-3.2.1-WhisperFix-build
          path: |
            /tmp/TapForge-3.2.1-WhisperFix-test.apk
            /tmp/TapForge-3.2.1-WhisperFix-release-unsigned.apk
            /tmp/SHA256SUMS.txt
          if-no-files-found: error
