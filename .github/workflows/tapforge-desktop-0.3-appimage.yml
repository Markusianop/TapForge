name: TapForge Desktop 0.3 AppImage

on:
  push:
    branches:
      - chatgpt/tapforge-open-interop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip python3-tk libpcsclite1 libfuse2 file desktop-file-utils
      - name: Expand source
        run: |
          set -euo pipefail
          mkdir -p /tmp/tfd03
          base64 -d .tapforge-build/TapForge-Desktop-0.3.0-source.tar.xz.b64 > /tmp/tfd03.tar.xz
          tar -xJf /tmp/tfd03.tar.xz -C /tmp/tfd03
      - name: Self-test
        working-directory: /tmp/tfd03
        run: python3 -m tapforge_desktop --self-test
      - name: Build standalone executable
        working-directory: /tmp/tfd03
        run: |
          python3 -m pip install --user pyinstaller
          python3 -m PyInstaller --noconfirm --clean --windowed --onefile             --name tapforge-desktop tapforge_entry.py
      - name: Build AppDir
        run: |
          set -euo pipefail
          APPDIR=/tmp/TapForge.AppDir
          mkdir -p "$APPDIR/usr/bin"
          cp /tmp/tfd03/dist/tapforge-desktop "$APPDIR/usr/bin/tapforge-desktop"
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/tapforge-desktop" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"
          cat > "$APPDIR/tapforge-desktop.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=TapForge Desktop
          Comment=Open NFC/smart-card workbench with addon interoperability
          Exec=tapforge-desktop
          Icon=tapforge-desktop
          Categories=Utility;Development;
          Terminal=false
          EOF
          if [ -f /usr/share/icons/hicolor/scalable/apps/utilities-terminal.svg ]; then
            cp /usr/share/icons/hicolor/scalable/apps/utilities-terminal.svg "$APPDIR/tapforge-desktop.svg"
          else
            cp /usr/share/icons/hicolor/scalable/apps/org.gnome.Terminal.svg "$APPDIR/tapforge-desktop.svg" || true
          fi
          test -x "$APPDIR/usr/bin/tapforge-desktop"
      - name: Download appimagetool
        run: |
          curl -fL https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -o /tmp/appimagetool
          chmod +x /tmp/appimagetool
      - name: Create AppImage
        env:
          ARCH: x86_64
        run: |
          /tmp/appimagetool --appimage-extract-and-run /tmp/TapForge.AppDir /tmp/TapForge-Desktop-0.3.0-x86_64.AppImage
          chmod +x /tmp/TapForge-Desktop-0.3.0-x86_64.AppImage
          file /tmp/TapForge-Desktop-0.3.0-x86_64.AppImage
          sha256sum /tmp/TapForge-Desktop-0.3.0-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: TapForge-Desktop-0.3.0-AppImage
          path: /tmp/TapForge-Desktop-0.3.0-x86_64.AppImage
          if-no-files-found: error
          retention-days: 7
