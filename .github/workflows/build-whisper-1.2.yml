name: Build TapForge Whisper 1.2

on:
  push:
    branches:
      - whisper-1.2-build

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Bluebird source
        run: |
          mkdir -p /tmp/tapforge-1.2
          base64 -d .tapforge-build/bluebird.b64 > /tmp/bluebird.tar.xz
          tar -xJf /tmp/bluebird.tar.xz -C /tmp/tapforge-1.2

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0" "platform-tools"

      - name: Install Gradle 8.9
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Build TapForge 1.2
        working-directory: /tmp/tapforge-1.2
        run: /tmp/gradle-8.9/bin/gradle --no-daemon clean assembleDebug assembleRelease

      - name: Collect APKs
        run: |
          cp /tmp/tapforge-1.2/app/build/outputs/apk/debug/app-debug.apk /tmp/TapForge-1.2-whisper-test.apk
          cp /tmp/tapforge-1.2/app/build/outputs/apk/release/app-release-unsigned.apk /tmp/TapForge-1.2-release-unsigned.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: TapForge-1.2-whisper-build
          path: |
            /tmp/TapForge-1.2-whisper-test.apk
            /tmp/TapForge-1.2-release-unsigned.apk
          if-no-files-found: error
