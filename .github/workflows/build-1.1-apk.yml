name: Build TapForge 1.1 unsigned release

on:
  push:
    branches:
      - build-1.1-apk

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore TapForge 1.1 source
        run: |
          mkdir -p /tmp/tapforge-1.1
          base64 -d .tapforge-build/source-1.1.tar.xz.b64 > /tmp/tapforge-1.1.tar.xz
          tar -xJf /tmp/tapforge-1.1.tar.xz -C /tmp/tapforge-1.1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0" "platform-tools"

      - name: Install Gradle 8.9
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Build unsigned release APK
        working-directory: /tmp/tapforge-1.1
        run: /tmp/gradle-8.9/bin/gradle --no-daemon clean assembleRelease

      - name: Collect unsigned APK and signing tools
        run: |
          cp /tmp/tapforge-1.1/app/build/outputs/apk/release/app-release-unsigned.apk /tmp/TapForge-1.1-unsigned.apk
          tar -cJf /tmp/android-build-tools-34.tar.xz -C "$ANDROID_HOME/build-tools" 34.0.0

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: TapForge-1.1-unsigned
          path: /tmp/TapForge-1.1-unsigned.apk
          if-no-files-found: error

      - name: Upload Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-build-tools-34
          path: /tmp/android-build-tools-34.tar.xz
          if-no-files-found: error
