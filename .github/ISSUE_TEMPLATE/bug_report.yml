name: Bug report
description: Report a reproducible problem in TapForge
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: TapForge version
      placeholder: "1.0"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Redact sensitive NFC payloads, credentials and private tag data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / logs
    validations:
      required: true
