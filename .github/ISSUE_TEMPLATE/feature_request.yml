name: Feature request
description: Suggest an NFC workflow or product improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Send / HCE
        - Receive
        - Physical tags
        - NDEF Studio / Library
        - APDU / ISO-DEP
        - UI / accessibility
        - Other
