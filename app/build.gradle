plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tapforge'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tapforge'
        minSdk 24
        targetSdk 35
        versionCode 15
        versionName '1.0'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
